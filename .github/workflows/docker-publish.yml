name: Build & Publish Docker Image

on:
  push:
    branches: [main, master]
    paths:
      - "Dockerfile"
      - "entrypoint.sh"
      - "versions.json"
      - ".github/workflows/docker-publish.yml"
  workflow_dispatch:          # allow manual trigger from the GitHub UI

permissions:
  contents: read
  packages: write             # needed to push to ghcr.io

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}   # e.g. yourname/tailscale-warp-container

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Set up QEMU for multi-arch builds (amd64 + arm64) ──────
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── Authenticate to ghcr.io with the built-in token ────────
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Compute image metadata / tags ───────────────────────────
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # always push "latest"
            type=raw,value=latest
            # tag with the short git SHA (e.g. sha-abc1234)
            type=sha,prefix=sha-
            # if versions.json exists, also tag with the package versions
            type=raw,value=ts-${{ env.TS_VER }},enable=${{ env.TS_VER != '' }}
          labels: |
            org.opencontainers.image.title=Tailscale + Cloudflare WARP exit node
            org.opencontainers.image.description=Containerised Tailscale exit node with Cloudflare WARP tunnel
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      # ── Read versions from versions.json (if present) ───────────
      - name: Read package versions
        id: versions
        run: |
          if [ -f versions.json ]; then
            TS=$(jq -r '.tailscale // ""' versions.json)
            WARP=$(jq -r '.cloudflare_warp // ""' versions.json)
            echo "TS_VER=$TS"   >> "$GITHUB_ENV"
            echo "WARP_VER=$WARP" >> "$GITHUB_ENV"
            echo "Tailscale: $TS  |  WARP: $WARP"
          else
            echo "versions.json not found — building without version pinning"
          fi

      # ── Build & push ─────────────────────────────────────────────
      # --no-cache ensures we always pick up the latest apt packages
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          no-cache: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
